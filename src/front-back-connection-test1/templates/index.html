<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Rank Control</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f0f0; }
        .container { text-align: center; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { padding: 0.5rem; font-size: 1rem; width: 60px; margin-right: 1rem; }
        button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
        button:disabled { background-color: #ccc; }
        #message { margin-top: 1.5rem; padding: 1rem; border-radius: 4px; display: none; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Move to Rank</h1>
        <div>
            <input type="number" id="rankInput" min="1" max="8" value="1">
            <button id="confirmBtn">Confirm</button>
        </div>
        <div id="message"></div>
    </div>

    <script>
        const btn = document.getElementById('confirmBtn');
        const input = document.getElementById('rankInput');
        const msgDiv = document.getElementById('message');

        btn.addEventListener('click', async () => {
            const rank = input.value;
            if (rank < 1 || rank > 8) {
                showMessage('Please enter a rank between 1 and 8.', 'error');
                return;
            }

            // UI State: Loading
            btn.disabled = true;
            showMessage('Sending command...', '');
            msgDiv.style.display = 'block';

            try {
                const response = await fetch(`/move/${rank}`, { method: 'POST' });
                const data = await response.json();

                if (data.status === 'success') {
                    showMessage(data.message, 'success');
                } else {
                    showMessage(data.message || 'An error occurred', 'error');
                }
            } catch (err) {
                showMessage('Failed to connect to server.', 'error');
            } finally {
                btn.disabled = false;
            }
        });

        function showMessage(text, type) {
            msgDiv.textContent = text;
            msgDiv.className = type;
            msgDiv.style.display = 'block';
        }
    </script>
</body>
</html>
