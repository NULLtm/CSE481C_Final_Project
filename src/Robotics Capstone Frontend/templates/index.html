<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Robotic Chess — Tablet Interface</title>

  <link rel="stylesheet"
        href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
        crossorigin="anonymous" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"
          crossorigin="anonymous"></script>

  <style>
    /* ------------------------------------------------------------------ */
    /* Reset & Base                                                         */
    /* ------------------------------------------------------------------ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #1a1a2e;
      --surface:      #16213e;
      --accent:       #0f3460;
      --highlight:    #e94560;
      --voice-color:  #7c3aed;
      --voice-light:  #a78bfa;
      --select-color: #0f3460;
      --text-primary: #eaeaea;
      --text-muted:   #a0a0b0;
      --radius:       12px;
      --shadow:       0 8px 32px rgba(0, 0, 0, 0.5);
      --board-max:    min(90vw, 600px);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 16px;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ------------------------------------------------------------------ */
    /* Layout                                                              */
    /* ------------------------------------------------------------------ */
    .page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px 40px;
      gap: 20px;
    }

    /* ------------------------------------------------------------------ */
    /* Header                                                              */
    /* ------------------------------------------------------------------ */
    header {
      text-align: center;
      width: 100%;
      max-width: 660px;
    }

    header h1 {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    #modeSubtitle {
      margin-top: 4px;
      font-size: 0.85rem;
      color: var(--text-muted);
      transition: color 0.3s;
    }

    /* ------------------------------------------------------------------ */
    /* Status Pill                                                         */
    /* ------------------------------------------------------------------ */
    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
      transition: background 0.4s;
    }

    .status-dot.connected    { background: #4caf50; }
    .status-dot.disconnected { background: var(--highlight); }
    .status-dot.pending      { background: #ff9800; animation: blink 1s infinite; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ------------------------------------------------------------------ */
    /* Mode Toggle                                                         */
    /* ------------------------------------------------------------------ */
    .mode-toggle {
      display: flex;
      background: var(--surface);
      border-radius: 50px;
      padding: 4px;
      gap: 4px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 380px;
    }

    .mode-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border: none;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      background: transparent;
      transition: background 0.25s, color 0.25s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .mode-btn:active { transform: scale(0.97); }

    .mode-btn.active[data-mode="select"] {
      background: var(--select-color);
      color: var(--text-primary);
      box-shadow: 0 2px 10px rgba(15, 52, 96, 0.6);
    }

    .mode-btn.active[data-mode="voice"] {
      background: var(--voice-color);
      color: #fff;
      box-shadow: 0 2px 10px rgba(124, 58, 237, 0.6);
    }

    .mode-icon { font-size: 1.1rem; line-height: 1; }

    /* ------------------------------------------------------------------ */
    /* Board Container                                                     */
    /* ------------------------------------------------------------------ */
    .board-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      width: 100%;
      max-width: calc(var(--board-max) + 40px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    #board {
      width: var(--board-max);
      touch-action: none;
    }

    [hidden] { display: none !important; }

    /* Highlight positioning */
    [data-square] { position: relative; }

    /* Selected square: Lichess yellowish highlight */
    [data-square].sq-selected::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: 0px;
      background: transparent; /* No yellow tint */
      box-shadow: inset 0 0 0 4px rgba(128, 128, 128, 0.8); /* Gray border */
    }

    /* Add these new rules for the overlay somewhere in your <style> section: */
    .board-wrapper {
      position: relative;
      width: var(--board-max);
    }

    .board-overlay {
      position: absolute;
      inset: 0;
      background: rgba(26, 26, 46, 0.8); /* Dark semi-transparent background */
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      border-radius: 4px;
    }

    .board-overlay.active {
      opacity: 1;
      pointer-events: auto; /* Catches any stray clicks while locked */
    }

    /* Valid moves: Lichess gray dot */
    [data-square].sq-valid::after {
      content: '';
      position: absolute;
      width: 25%;
      height: 25%;
      background: rgba(0, 0, 0, 0.25); 
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: none;
      pointer-events: none; 
    }

    /* ------------------------------------------------------------------ */
    /* Turn & Info Strip                                                   */
    /* ------------------------------------------------------------------ */
    .info-strip {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .turn-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .turn-swatch {
      width: 18px; height: 18px;
      border-radius: 4px;
      border: 2px solid rgba(255,255,255,0.2);
      background: #f0d9b5;
      transition: background 0.3s;
    }

    .turn-swatch.black { background: #333; }

    /* ------------------------------------------------------------------ */
    /* Voice Panel                                                         */
    /* ------------------------------------------------------------------ */
    .voice-panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 4px 0;
    }

    .mic-btn {
      width: 90px; height: 90px;
      border-radius: 50%;
      border: none;
      background: var(--voice-color);
      color: #fff;
      font-size: 2.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.5);
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      position: relative;
    }

    .mic-btn:active { transform: scale(0.94); }

    .mic-btn.listening {
      background: var(--highlight);
      box-shadow: 0 4px 24px rgba(233, 69, 96, 0.6);
      animation: mic-pulse 1.2s ease-in-out infinite;
    }

    .mic-btn.processing {
      background: #ff9800;
      box-shadow: 0 4px 20px rgba(255, 152, 0, 0.5);
    }

    @keyframes mic-pulse {
      0%, 100% { box-shadow: 0 4px 24px rgba(233, 69, 96, 0.6); transform: scale(1); }
      50%       { box-shadow: 0 4px 40px rgba(233, 69, 96, 0.9); transform: scale(1.06); }
    }

    .mic-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
      letter-spacing: 0.04em;
    }

    .transcript-box {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 12px 16px;
      min-height: 52px;
      font-size: 0.9rem;
      color: var(--text-primary);
      text-align: center;
      line-height: 1.5;
    }

    .transcript-box .heard-text  { color: var(--voice-light); font-style: italic; }
    .transcript-box .hint-text   { color: var(--text-muted); }
    .transcript-box .parsed-move { color: #4caf50; font-weight: 700; }
    .transcript-box .error-text  { color: var(--highlight); }

    /* ------------------------------------------------------------------ */
    /* Player Robot / Human Controls                                      */
    /* ------------------------------------------------------------------ */
    .player-controls {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 380px;
    }

    .player-ctrl {
      flex: 1;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow);
    }

    .player-ctrl-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .ctrl-toggle {
      display: flex;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 3px;
      gap: 3px;
    }

    .ctrl-btn {
      flex: 1;
      padding: 7px 6px;
      border: none;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: var(--text-muted);
      transition: background 0.2s, color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .ctrl-btn.active[data-type="human"] {
      background: var(--accent);
      color: var(--text-primary);
    }

    .ctrl-btn.active[data-type="robot"] {
      background: var(--highlight);
      color: #fff;
    }

    /* ------------------------------------------------------------------ */
    /* Select Panel hint                                                   */
    /* ------------------------------------------------------------------ */
    .select-hint {
      width: 100%;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      padding: 4px 0;
      min-height: 22px;
      transition: color 0.2s;
    }

    .select-hint.active { color: #ffd700; font-weight: 600; }

    /* ------------------------------------------------------------------ */
    /* Controls                                                            */
    /* ------------------------------------------------------------------ */
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button.std-btn {
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    button.std-btn:active { transform: scale(0.96); }

    .btn-primary   { background: var(--highlight); color: #fff; }
    .btn-secondary { background: var(--accent);    color: var(--text-primary); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ------------------------------------------------------------------ */
    /* Move Log                                                            */
    /* ------------------------------------------------------------------ */
    .move-log-section {
      width: 100%;
      max-width: calc(var(--board-max) + 40px);
    }

    .move-log-section h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    #moveLog {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 12px 16px;
      min-height: 64px;
      max-height: 140px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.7;
      box-shadow: var(--shadow);
    }

    #moveLog .move-entry         { color: var(--text-primary); }
    #moveLog .move-entry.event   { color: #4caf50; font-style: italic; }

    /* ------------------------------------------------------------------ */
    /* Responsive                                                          */
    /* ------------------------------------------------------------------ */
    @media (max-width: 400px) {
      header h1 { font-size: 1.2rem; }
      button.std-btn { padding: 10px 18px; font-size: 0.82rem; }
      .mode-btn { font-size: 0.82rem; padding: 10px 14px; }
    }

    /* ------------------------------------------------------------------ */
    /* Promotion Dialog                                                    */
    /* ------------------------------------------------------------------ */
    #promoModal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #promoBackdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
    }

    #promoDialog {
      position: relative;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px 28px 28px;
      text-align: center;
      z-index: 1;
      min-width: 280px;
    }

    #promoDialog p {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 18px;
      color: var(--text-primary);
    }

    #promoChoices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .promo-btn {
      padding: 16px 12px;
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      background: var(--accent);
      color: var(--text-primary);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .promo-btn:hover  { background: var(--highlight); border-color: var(--highlight); }
    .promo-btn:active { transform: scale(0.95); }

    /* ------------------------------------------------------------------ */
    /* Robot-Busy Overlay                                                  */
    /* ------------------------------------------------------------------ */
    .board-card { position: relative; }

    #robotBusyOverlay {
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      background: rgba(22, 33, 62, 0.78);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
      backdrop-filter: blur(2px);
    }

    #robotBusyOverlay p {
      color: var(--text-primary);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .spinner {
      width: 44px; height: 44px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: var(--highlight);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ------------------------------------------------------------------ */
    /* Piece Identity Labels                                               */
    /* ------------------------------------------------------------------ */
    .piece-label {
      display: none;
    }

    /* ------------------------------------------------------------------ */
    /* Game-Over Banner                                                    */
    /* ------------------------------------------------------------------ */
    #gameOverBanner {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #gameOverBackdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
    }

    #gameOverBox {
      position: relative;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px 36px;
      text-align: center;
      z-index: 1;
      min-width: 260px;
    }

    #gameOverBox h2 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffd700;
      margin-bottom: 8px;
    }

    #gameOverBox p {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      text-transform: capitalize;
    }
  </style>
</head>
<body>

<div class="page-wrapper">

  <header>
    <h1>Robotic Chess</h1>
    <p id="modeSubtitle">Tap or drag a piece to move.</p>
  </header>

  <div class="status-row">
    <div class="status-dot pending" id="statusDot"></div>
    <span id="statusText">Connecting…</span>
  </div>

  <div class="mode-toggle" role="group" aria-label="Input mode">
    <button class="mode-btn active" data-mode="select" id="modeSelectBtn">
      <span class="mode-icon">&#9610;</span> Select Piece
    </button>
    <button class="mode-btn" data-mode="voice" id="modeVoiceBtn">
      <span class="mode-icon">&#127908;</span> Voice Command
    </button>
  </div>

  <!-- Per-player robot / human toggle -->
  <div class="player-controls">
    <div class="player-ctrl">
      <div class="player-ctrl-label">
        <div class="turn-swatch"></div> White
      </div>
      <div class="ctrl-toggle">
        <button class="ctrl-btn active" data-color="w" data-type="human">Human</button>
        <button class="ctrl-btn"        data-color="w" data-type="robot">Robot</button>
      </div>
    </div>
    <div class="player-ctrl">
      <div class="player-ctrl-label">
        <div class="turn-swatch black"></div> Black
      </div>
      <div class="ctrl-toggle">
        <button class="ctrl-btn active" data-color="b" data-type="human">Human</button>
        <button class="ctrl-btn"        data-color="b" data-type="robot">Robot</button>
      </div>
    </div>
  </div>

  <div class="board-card">

    <div class="board-wrapper">
      <div id="board"></div>
      <div id="boardOverlay" class="board-overlay">Robot is moving...</div>
    </div>

    <div id="robotBusyOverlay" style="display:none">
      <div class="spinner"></div>
      <p>Robot is moving…</p>
    </div>

    <div class="select-hint" id="selectHint">Tap or drag a piece to select it.</div>

    <div class="voice-panel" id="voicePanel" hidden>
      <button class="mic-btn" id="micBtn" aria-label="Hold to speak your move">
        &#127908;
      </button>
      <span class="mic-label" id="micLabel">TAP TO RECORD</span>
      <div class="transcript-box" id="transcriptBox">
        <span class="hint-text">Say &ldquo;e2 to e4&rdquo;</span>
      </div>
    </div>

    <div class="info-strip">
      <div class="turn-badge">
        <div class="turn-swatch" id="turnSwatch"></div>
        <span id="turnLabel">White to move</span>
      </div>
      <span id="moveCount">Move 1</span>
    </div>

    <div class="controls">
      <button class="std-btn btn-secondary" id="btnFlip">Flip Board</button>
      <button class="std-btn btn-primary"   id="btnReset">New Game</button>
      <button class="std-btn btn-secondary" id="btnResetStretch">Reset Stretch</button>
    </div>
  </div>

  <div class="move-log-section">
    <h2>Move Log</h2>
    <div id="moveLog"></div>
  </div>

</div>

<!-- Promotion picker modal -->
<div id="promoModal" style="display:none">
  <div id="promoBackdrop"></div>
  <div id="promoDialog">
    <p>Promote pawn to…</p>
    <div id="promoChoices">
      <button class="promo-btn" data-piece="q">♛ Queen</button>
      <button class="promo-btn" data-piece="r">♜ Rook</button>
      <button class="promo-btn" data-piece="b">♝ Bishop</button>
      <button class="promo-btn" data-piece="n">♞ Knight</button>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"
        crossorigin="anonymous"></script>

<script>
(function () {
  'use strict';

  // =========================================================================
  // State
  // =========================================================================
  let isBoardLocked = false;
  let currentMode = 'select'; // 'select' | 'voice'
  let selectedSquare = null;
  let moveNumber = 1;
  let pendingMove = null; // cleared on every server response; guards against stale state

  // Tracks whether each player's moves should be physically executed by the robot.
  // false = human only (digital board updates, robot stays still)
  // true  = robot executes the move on the physical board
  const robotPlayers = { w: false, b: false };

  $('.ctrl-btn').on('click', function () {
    const color = $(this).data('color');
    const type  = $(this).data('type');
    robotPlayers[color] = (type === 'robot');
    // Update active highlight within this player's toggle group
    $(`.ctrl-btn[data-color="${color}"]`).removeClass('active');
    $(this).addClass('active');
  });

  // =========================================================================
  // WebSocket
  // =========================================================================
  const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
  const WS_URL   = `${protocol}://${location.host}/ws`;
  let socket      = null;
  let reconnectMs = 2000;

  function setStatus(state, text) {
    $('#statusDot').removeClass('connected disconnected pending').addClass(state);
    $('#statusText').text(text);
  }

  function connect() {
    setStatus('pending', 'Connecting…');
    socket = new WebSocket(WS_URL);

    socket.addEventListener('open', () => {
      setStatus('connected', 'Connected');
      reconnectMs = 2000;
      logEvent('Connected to server.');
    });

    socket.addEventListener('close', () => {
      setStatus('disconnected', `Reconnecting in ${reconnectMs / 1000}s…`);
      logEvent('Connection lost — reconnecting…');
      setTimeout(connect, reconnectMs);
      reconnectMs = Math.min(reconnectMs * 2, 30000);
    });

    socket.addEventListener('error', () => setStatus('disconnected', 'Connection error'));

    socket.addEventListener('message', (evt) => {
      let msg;
      try { msg = JSON.parse(evt.data); } catch { return; }

      // ---------------------------------------------------------------
      // Update piece identity BEFORE loading the new FEN so chess.js
      // still reflects the pre-move board when we call chess.moves().
      // This runs on ALL connected clients, not just the one that moved.
      // ---------------------------------------------------------------
      if (msg.event === 'move' && msg.uci) {
        const from  = msg.uci.slice(0, 2);
        const to    = msg.uci.slice(2, 4);
        const promo = msg.uci.length > 4 ? msg.uci[4] : '';
        updatePieceIdentityOnMove(from, to, promo);
      }
      // pendingMove is no longer needed for identity — clear it regardless.
      pendingMove = null;

      if (msg.fen) {
        board.position(msg.fen, false); // false = instant snap to new FEN
        chess.load(msg.fen);
        updateTurnDisplay(msg.fen);
        updatePieceLabels();  // re-render labels after chessboard.js repaints
      }

      if (msg.event === 'invalid') {
        // Invalid move — unlock immediately, identity map unchanged.
        isBoardLocked = false;
        $('#boardOverlay').removeClass('active');
        clearSelection();
        setVoiceResult(`Could not play "${msg.uci}". Try again.`, 'error');
      } else if (msg.event === 'move' && msg.uci) {
        // Only unlock if the robot is NOT about to execute this move physically.
        // If robot_executing, stay locked until 'robot_idle' arrives.
        if (!msg.robot_executing) {
          isBoardLocked = false;
          $('#boardOverlay').removeClass('active');
        }
        logMove(msg.uci);
        clearSelection();
      } else if (msg.event === 'reset') {
        isBoardLocked = false;
        $('#boardOverlay').removeClass('active');
        $('#moveLog').empty();
        moveNumber = 1;
        clearSelection();
        hideGameOver();
        resetPieceIdentity();
        updatePieceLabels();
        logEvent('Game reset.');
      } else if (msg.event === 'sync') {
        isBoardLocked = false;
        $('#boardOverlay').removeClass('active');
        logEvent('Board synchronised.');
      } else if (msg.event === 'robot_busy') {
        $('#robotBusyOverlay').show();
        logEvent('Robot executing move…');
      } else if (msg.event === 'robot_idle') {
        // Robot finished — now safe to unlock the board.
        isBoardLocked = false;
        $('#boardOverlay').removeClass('active');
        $('#robotBusyOverlay').hide();
        logEvent('Robot ready.');
      } else if (msg.event === 'game_over' && msg.reason) {
        showGameOver(msg.reason);
        logEvent(`Game over: ${msg.reason}.`);
      }
    });
  }

  // =========================================================================
  // Piece Identity Tracking
  // Keeps a live map of square → full ArUco marker name (e.g. 'WhitePawn3')
  // so we can send the exact piece name to the robot service.
  // Pieces are numbered left-to-right (a-file = 1, h-file = 8 for pawns;
  // a-file = 1, h-file = 2 for symmetric pieces like rooks/knights/bishops).
  // =========================================================================
  const INITIAL_PIECE_IDENTITY = {
    // White back rank (a1→h1)
    a1: 'WhiteRook1',   b1: 'WhiteKnight1', c1: 'WhiteBishop1', d1: 'WhiteQueen1',
    e1: 'WhiteKing1',   f1: 'WhiteBishop2', g1: 'WhiteKnight2', h1: 'WhiteRook2',
    // White pawns (a2→h2)
    a2: 'WhitePawn1',   b2: 'WhitePawn2',   c2: 'WhitePawn3',   d2: 'WhitePawn4',
    e2: 'WhitePawn5',   f2: 'WhitePawn6',   g2: 'WhitePawn7',   h2: 'WhitePawn8',
    // Black pawns (a7→h7)
    a7: 'BlackPawn1',   b7: 'BlackPawn2',   c7: 'BlackPawn3',   d7: 'BlackPawn4',
    e7: 'BlackPawn5',   f7: 'BlackPawn6',   g7: 'BlackPawn7',   h7: 'BlackPawn8',
    // Black back rank (a8→h8)
    a8: 'BlackRook1',   b8: 'BlackKnight1', c8: 'BlackBishop1', d8: 'BlackQueen1',
    e8: 'BlackKing1',   f8: 'BlackBishop2', g8: 'BlackKnight2', h8: 'BlackRook2',
  };

  let pieceIdentity = {};

  function resetPieceIdentity() {
    pieceIdentity = Object.assign({}, INITIAL_PIECE_IDENTITY);
  }

  // Shorten full marker name to a compact label for display on the board.
  // e.g. 'WhitePawn3' → 'P3', 'BlackKnight1' → 'N1', 'WhiteKing1' → 'K1'
  function getPieceShortLabel(name) {
    const m = name.match(/(Pawn|Knight|Bishop|Rook|Queen|King)(\d+)/);
    if (!m) return name;
    const t = { Pawn: 'P', Knight: 'N', Bishop: 'B', Rook: 'R', Queen: 'Q', King: 'K' };
    return (t[m[1]] || '?') + m[2];
  }

  // Render small labels on every occupied square according to pieceIdentity.
  // Must be called after every board.position() call (chessboard.js rebuilds
  // the inner HTML of squares, removing previously injected elements).
  function updatePieceLabels() {
    $('.piece-label').remove();
    for (const [sq, name] of Object.entries(pieceIdentity)) {
      const label = getPieceShortLabel(name);
      if (!label) continue;
      $(`[data-square="${sq}"]`).append(
        `<div class="piece-label">${label}</div>`
      );
    }
  }

  // Update pieceIdentity for a move BEFORE chess.js pushes it, so we still
  // have access to the pre-move board state via chess.moves().
  function updatePieceIdentityOnMove(from, to, promotion) {
    const moves = chess.moves({ verbose: true });
    const moveObj = moves.find(m =>
      m.from === from && m.to === to && (!promotion || m.promotion === promotion)
    );

    if (!moveObj) {
      // Fallback: just relocate the piece
      if (pieceIdentity[from]) {
        pieceIdentity[to] = pieceIdentity[from];
        delete pieceIdentity[from];
      }
      return;
    }

    // Remove captured piece from identity map
    if (moveObj.captured) {
      if (moveObj.flags.includes('e')) {
        // En passant: the captured pawn sits on the ep square (same file as
        // destination, same rank as origin)
        const epSq = to[0] + from[1];
        delete pieceIdentity[epSq];
      } else {
        delete pieceIdentity[to];  // normal capture
      }
    }

    // Relocate the moving piece
    if (pieceIdentity[from]) {
      pieceIdentity[to] = pieceIdentity[from];
      delete pieceIdentity[from];
    }

    // For castling, also relocate the rook
    if (moveObj.flags.includes('k')) {
      const rank = from[1];
      if (pieceIdentity['h' + rank]) {
        pieceIdentity['f' + rank] = pieceIdentity['h' + rank];
        delete pieceIdentity['h' + rank];
      }
    } else if (moveObj.flags.includes('q')) {
      const rank = from[1];
      if (pieceIdentity['a' + rank]) {
        pieceIdentity['d' + rank] = pieceIdentity['a' + rank];
        delete pieceIdentity['a' + rank];
      }
    }
  }

  function sendMove(from, to, promotion) {
    if (socket && socket.readyState === WebSocket.OPEN) {
      // chess.turn() is still the moving player's colour at this point
      // (local state only updates when server echoes back a FEN).
      const isRobotMove = robotPlayers[chess.turn()];

      // Capture both piece names BEFORE updating the identity map (which deletes
      // the captured piece's entry).
      const pieceName = pieceIdentity[from] || '';

      const moves = chess.moves({ verbose: true });
      const moveObj = moves.find(m =>
        m.from === from && m.to === to && (!promotion || m.promotion === promotion)
      );
      let capturedPieceName = '';
      if (moveObj && moveObj.captured) {
        if (moveObj.flags.includes('e')) {
          // En passant: captured pawn is on same file as destination, same rank as origin
          capturedPieceName = pieceIdentity[to[0] + from[1]] || '';
        } else {
          capturedPieceName = pieceIdentity[to] || '';
        }
      }

      // For castling, also look up the rook's name from pieceIdentity while we
      // still have the pre-move state.  Kingside rook is on the h-file, queenside
      // on the a-file — same rank as the king.
      let rookPieceName = '';
      if (moveObj) {
        if (moveObj.flags.includes('k')) {          // kingside castle
          rookPieceName = pieceIdentity['h' + from[1]] || '';
        } else if (moveObj.flags.includes('q')) {   // queenside castle
          rookPieceName = pieceIdentity['a' + from[1]] || '';
        }
      }

      isBoardLocked = true;
      $('#boardOverlay').addClass('active');
      const msg = { from, to, robot: isRobotMove, piece: pieceName, captured_piece: capturedPieceName };
      if (promotion)     msg.promotion  = promotion;
      if (rookPieceName) msg.rook_piece = rookPieceName;
      socket.send(JSON.stringify(msg));
    }
  }

  // =========================================================================
  // Board setup
  // =========================================================================
  const chess = new Chess();

  const config = {
    draggable : true,           // Enables picking up pieces
    moveSpeed : 'fast',         // Speeds up UI animation
    snapbackSpeed: 1,
    snapSpeed: 1,
    position  : 'start',
    pieceTheme: 'https://lichess1.org/assets/piece/cburnett/{piece}.svg',

    onDragStart: function (source, piece, position, orientation) {
      // Prevent drag if board is locked, mode is wrong, or disconnected
      if (isBoardLocked || currentMode !== 'select' || !socket || socket.readyState !== WebSocket.OPEN) {
        return false;
      }
      
      if ((chess.turn() === 'w' && piece.search(/^b/) !== -1) ||
          (chess.turn() === 'b' && piece.search(/^w/) !== -1)) {
        return false;
      }

      // Clear any previous highlights from tapping before we start dragging
      clearSelection();

      // Highlight the piece being dragged and its legal moves
      selectPiece(source);
    },

    onDrop: function (source, target) {
      // If dropped on the same square, let handleSquareClick manage click-to-move
      if (source === target) return; 

      // Check if move is locally valid using chess.js before sending to server
      const legalMoves = chess.moves({ verbose: true });
      const isValid = legalMoves.some(m => m.from === source && m.to === target);

      if (!isValid) {
        clearSelection();
        return 'snapback'; // Invalid move, snap piece back
      }

      // Move is valid, send to server
      sendMove(source, target);
      clearSelection();
    },
  };

  const board = Chessboard('board', config);
  $(window).resize(() => board.resize());

  // =========================================================================
  // Mode Selection
  // =========================================================================
  const SUBTITLES = {
    select: 'Tap or drag a piece to move.',
    voice:  'Tap mic → say "e2 to e4" → tap to stop.',
  };

  function switchMode(mode) {
    currentMode = mode;

    $('.mode-btn').removeClass('active');
    $(`.mode-btn[data-mode="${mode}"]`).addClass('active');

    if (mode === 'voice') {
      $('#voicePanel').removeAttr('hidden');
      $('#selectHint').hide();
      // Don't auto-start — user must tap the mic to begin recording
    } else {
      $('#voicePanel').attr('hidden', '');
      $('#selectHint').show();
      stopListening();    // abort any in-progress recording when leaving voice mode
    }

    $('#modeSubtitle').text(SUBTITLES[mode]);
    clearSelection();
  }

  $('.mode-btn').on('click', function () {
    switchMode($(this).data('mode'));
  });

  // =========================================================================
  // SELECT PIECE MODE (Tap to Move)
  // =========================================================================
  $('#board').on('click', '[data-square]', function () {
    if (currentMode !== 'select') return;
    if (!socket || socket.readyState !== WebSocket.OPEN) return;

    const square = $(this).data('square');
    handleSquareClick(square);
  });

  function handleSquareClick(square) {
    if (isBoardLocked) return; // Ignore clicks if waiting for server

    const pos = board.position();
    const isOwnPiece = pos[square] && pos[square][0] === chess.turn();

    if (selectedSquare === null) {
      // First click: select if it's our piece
      if (!isOwnPiece) return;
      selectPiece(square);
    } else {
      // Second click
      if (square === selectedSquare) {
        // Tapped the same piece again -> deselect
        clearSelection();
      } else if (isOwnPiece) {
        // Tapped another of our own pieces -> switch selection
        clearSelection();
        selectPiece(square);
      } else {
        // Tapped an empty square or enemy piece -> attempt move
        sendMove(selectedSquare, square);
        clearSelection();
      }
    }
  }

  function selectPiece(square) {
    selectedSquare = square;
    highlightSquare(square, 'selected');

    const legalMoves = chess.moves({ square, verbose: true });
    legalMoves.forEach(m => highlightSquare(m.to, 'valid'));

    const count = legalMoves.length;
    $('#selectHint').addClass('active')
      .text(`${square.toUpperCase()} selected — ${count} move${count !== 1 ? 's' : ''} available.`);
  }

  function highlightSquare(square, type) {
    $(`[data-square="${square}"]`).addClass(`sq-${type}`);
  }

  function clearSelection() {
    selectedSquare = null;
    $('[data-square]').removeClass('sq-selected sq-valid');
    $('#selectHint').removeClass('active').text('Tap or drag a piece to select it.');
  }

  // =========================================================================
  // VOICE COMMAND MODE  (faster-whisper via POST /transcribe)
  // =========================================================================
  let mediaRecorder = null;
  let audioChunks   = [];
  let listening     = false;

  // Tap mic to START recording.  Tap again to STOP — audio is POSTed to
  // /transcribe, whisper transcribes it, and the result is checked for the
  // wake phrase "Robochess move <from> <to>".
  $('#micBtn').on('click', () => {
    if (isBoardLocked) {
      setVoiceResult('Waiting for robot to finish…', 'error');
      return;
    }
    if (listening) {
      stopListening();
    } else {
      startListening();
    }
  });

  async function startListening() {
    if (listening) return;
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      setVoiceResult('Microphone access denied. Check browser permissions.', 'error');
      console.error('[Voice] getUserMedia error:', e);
      return;
    }

    audioChunks   = [];
    mediaRecorder = new MediaRecorder(stream);

    mediaRecorder.ondataavailable = (evt) => {
      if (evt.data && evt.data.size > 0) audioChunks.push(evt.data);
    };

    mediaRecorder.onstop = async () => {
      // Release the microphone immediately after recording stops.
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      console.log('[Voice] recording stopped — blob size:', blob.size, 'bytes');
      await transcribeAndProcess(blob);
    };

    mediaRecorder.start();
    listening = true;
    updateMicUI();
    setVoiceResult('<span class="hint-text">Recording… tap to stop</span>');
    console.log('[Voice] recording started');
  }

  function stopListening() {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();   // triggers onstop → transcribeAndProcess
    }
    listening = false;
    updateMicUI();
  }

  async function transcribeAndProcess(blob) {
    setVoiceResult('<span class="hint-text">Transcribing…</span>');

    const formData = new FormData();
    formData.append('file', blob, 'audio.webm');

    let transcript = '';
    try {
      const res  = await fetch('/transcribe', { method: 'POST', body: formData });
      const data = await res.json();
      transcript = (data.text || '').trim();
      console.log('[Voice] raw transcript:', JSON.stringify(transcript));
      if (data.error) console.warn('[Voice] server error:', data.error);
    } catch (e) {
      setVoiceResult('Transcription request failed.', 'error');
      console.error('[Voice] fetch error:', e);
      return;
    }

    if (!transcript) {
      setVoiceResult('<span class="hint-text">Nothing heard — try again</span>');
      return;
    }

    // Show the full raw transcript so the user can see exactly what was heard.
    console.log('[Voice] transcript received:', JSON.stringify(transcript));
    setVoiceResult(`<span class="heard-text">"${escHtml(transcript)}"</span>`);

    // Try to parse a chess move directly from whatever was said.
    const parsed = parseVoiceMove(transcript);
    if (parsed) {
      console.log('[Voice] parsed move:', parsed.from, '→', parsed.to);
      setVoiceResult(
        `<span class="parsed-move">Moving: ${parsed.from.toUpperCase()} → ${parsed.to.toUpperCase()}</span>`
      );
      if (isPromotion(parsed.from, parsed.to)) {
        requestPromotion(parsed.from, parsed.to);
      } else {
        sendMove(parsed.from, parsed.to);
      }
    } else {
      console.log('[Voice] could not parse a move from:', transcript);
      setVoiceResult(
        `<span class="heard-text">"${escHtml(transcript)}"</span>` +
        `<br><span class="error-text">Couldn't find a move — try &ldquo;e2 to e4&rdquo;</span>`
      );
    }
  }

  function updateMicUI() {
    const $btn = $('#micBtn');
    const $lbl = $('#micLabel');
    $btn.removeClass('listening processing');
    if (listening) {
      $btn.addClass('listening');
      $lbl.text('RECORDING — TAP TO STOP');
    } else {
      $lbl.text('TAP TO RECORD');
    }
  }

  function setVoiceResult(text, type) {
    if (currentMode !== 'voice') return;
    let html;
    if (type === 'heard')  html = `<span class="heard-text">${escHtml(text)}</span>`;
    else if (type === 'parsed') html = `<span class="parsed-move">${escHtml(text)}</span>`;
    else if (type === 'error')  html = `<span class="error-text">${escHtml(text)}</span>`;
    else                        html = text;
    $('#transcriptBox').html(html);
  }

  // Maps spoken piece names (including common mishearings) to chess.js letters.
  const PIECE_WORDS = {
    'king': 'k', 'queen': 'q', 'rook': 'r',
    'bishop': 'b', 'knight': 'n', 'night': 'n', 'pawn': 'p',
  };

  // Resolve a SAN string like 'O-O' into a {from, to} pair using the live board.
  function resolveSAN(san) {
    const moves = chess.moves({ verbose: true });
    const m = moves.find(mv => mv.san === san || mv.san.replace(/[+#]/g, '') === san);
    return m ? { from: m.from, to: m.to } : null;
  }

  // Find which legal move involves pieceLetter landing on dest.
  function resolveByPiece(pieceLetter, dest) {
    const moves = chess.moves({ verbose: true });
    const m = moves.find(mv => mv.piece === pieceLetter && mv.to === dest);
    return m ? { from: m.from, to: m.to } : null;
  }

  // True if any legal move from→to is a pawn promotion.
  function isPromotion(from, to) {
    return chess.moves({ verbose: true })
      .some(m => m.from === from && m.to === to && m.promotion);
  }

  // Show the promotion-piece picker dialog then send the move.
  function requestPromotion(from, to) {
    $('#promoModal').show();
    $('#promoChoices .promo-btn').off('click').on('click', function () {
      $('#promoModal').hide();
      sendMove(from, to, $(this).data('piece'));
    });
  }

  // Extract chess squares from a transcript, handling Whisper quirks:
  //   "b1 to b3"  → strict word-boundary match works fine
  //   "b1b3"      → squares jammed together with no separator
  //   "b12b3"     → extra digit inserted (Whisper hears "to" as "2" or "12")
  function extractSquares(text) {
    // 1. Strict pass — word boundaries (covers normal speech and "e2 e4")
    const strict = text.match(/\b[a-h][1-8]\b/g);
    if (strict && strict.length >= 2) return strict;

    // 2. Loose pass — match [a-h] followed by one or more digits and keep
    //    only the first digit as the rank.  This handles concatenated squares
    //    ("b1b3" → b1, b3) and extra digits ("b12b3" → b1, b3).
    const loose = [];
    const re = /[a-h]\d+/g;
    let m;
    while ((m = re.exec(text)) !== null) {
      const rank = m[0][1]; // first digit after the file letter
      if (rank >= '1' && rank <= '8') loose.push(m[0][0] + rank);
    }
    return loose.length >= 2 ? loose : null;
  }

  function parseVoiceMove(text) {
    text = text.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').trim();

    // Castling
    const isQueenside = /queen.?side|long\s*castl|o\s*o\s*o/.test(text);
    const isKingside  = !isQueenside && /castl|king.?side|o\s*o/.test(text);
    if (isQueenside) return resolveSAN('O-O-O');
    if (isKingside)  return resolveSAN('O-O');

    // Two explicit squares — strict first, loose fallback for Whisper quirks
    const squares = extractSquares(text);
    if (squares && squares.length >= 2) {
      return { from: squares[0], to: squares[1] };
    }

    // Piece name + destination: "knight to f3", "bishop takes e5"
    for (const [word, letter] of Object.entries(PIECE_WORDS)) {
      if (text.includes(word)) {
        const dest = extractSquares(text);
        if (dest) return resolveByPiece(letter, dest[0]);
        break;
      }
    }

    return null;
  }

  // =========================================================================
  // Shared UI helpers
  // =========================================================================
  function updateTurnDisplay(fen) {
    const parts = fen.split(' ');
    const isWhite = parts[1] === 'w';
    const fullMove = parseInt(parts[5] || '1', 10);
    $('#turnSwatch').toggleClass('black', !isWhite);
    $('#turnLabel').text(isWhite ? 'White to move' : 'Black to move');
    $('#moveCount').text(`Move ${fullMove}`);
  }

  function logMove(uci) {
    appendLog($('<div class="move-entry"></div>').text(`${moveNumber++}. ${uci}`));
  }

  function logEvent(text) {
    appendLog($('<div class="move-entry event"></div>').text(text));
  }

  function appendLog($el) {
    const $log = $('#moveLog');
    $log.append($el);
    $log.scrollTop($log[0].scrollHeight);
  }

  function escHtml(str) {
    return $('<span>').text(str).html();
  }

  // =========================================================================
  // Button handlers
  // =========================================================================
  $('#btnFlip').on('click', () => board.flip());

  $('#btnResetStretch').on('click', () => {
    if (!confirm('Send the Stretch robot to its home position?')) return;
    fetch('/reset_stretch', { method: 'POST' })
      .then(r => r.json())
      .then(() => logEvent('Stretch reset requested.'))
      .catch(() => logEvent('Reset Stretch request failed.'));
  });

  $('#btnReset').on('click', () => {
    if (!confirm('Start a new game? The current game will be lost.')) return;
    fetch('/reset', { method: 'POST' })
      .then(r => r.json())
      .then(data => {
        if (data.fen) {
          board.position(data.fen, false);
          updateTurnDisplay(data.fen);
          resetPieceIdentity();
          updatePieceLabels();
        }
      })
      .catch(() => logEvent('Reset request failed.'));
  });

  // =========================================================================
  // Boot
  // =========================================================================
  resetPieceIdentity();
  connect();
  switchMode('select');
  updatePieceLabels();

})();
</script>
</body>
</html>
