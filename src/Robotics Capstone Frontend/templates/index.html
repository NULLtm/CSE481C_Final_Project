<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Robotic Chess — Tablet Interface</title>

  <link rel="stylesheet"
        href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
        crossorigin="anonymous" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"
          crossorigin="anonymous"></script>

  <style>
    /* ------------------------------------------------------------------ */
    /* Reset & Base                                                         */
    /* ------------------------------------------------------------------ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #1a1a2e;
      --surface:      #16213e;
      --accent:       #0f3460;
      --highlight:    #e94560;
      --voice-color:  #7c3aed;
      --voice-light:  #a78bfa;
      --select-color: #0f3460;
      --text-primary: #eaeaea;
      --text-muted:   #a0a0b0;
      --radius:       12px;
      --shadow:       0 8px 32px rgba(0, 0, 0, 0.5);
      --board-max:    min(90vw, 600px);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 16px;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ------------------------------------------------------------------ */
    /* Layout                                                              */
    /* ------------------------------------------------------------------ */
    .page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px 40px;
      gap: 20px;
    }

    /* ------------------------------------------------------------------ */
    /* Header                                                              */
    /* ------------------------------------------------------------------ */
    header {
      text-align: center;
      width: 100%;
      max-width: 660px;
    }

    header h1 {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    #modeSubtitle {
      margin-top: 4px;
      font-size: 0.85rem;
      color: var(--text-muted);
      transition: color 0.3s;
    }

    /* ------------------------------------------------------------------ */
    /* Status Pill                                                         */
    /* ------------------------------------------------------------------ */
    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
      transition: background 0.4s;
    }

    .status-dot.connected    { background: #4caf50; }
    .status-dot.disconnected { background: var(--highlight); }
    .status-dot.pending      { background: #ff9800; animation: blink 1s infinite; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ------------------------------------------------------------------ */
    /* Mode Toggle                                                         */
    /* ------------------------------------------------------------------ */
    .mode-toggle {
      display: flex;
      background: var(--surface);
      border-radius: 50px;
      padding: 4px;
      gap: 4px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 380px;
    }

    .mode-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border: none;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      background: transparent;
      transition: background 0.25s, color 0.25s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .mode-btn:active { transform: scale(0.97); }

    .mode-btn.active[data-mode="select"] {
      background: var(--select-color);
      color: var(--text-primary);
      box-shadow: 0 2px 10px rgba(15, 52, 96, 0.6);
    }

    .mode-btn.active[data-mode="voice"] {
      background: var(--voice-color);
      color: #fff;
      box-shadow: 0 2px 10px rgba(124, 58, 237, 0.6);
    }

    .mode-icon { font-size: 1.1rem; line-height: 1; }

    /* ------------------------------------------------------------------ */
    /* Board Container                                                     */
    /* ------------------------------------------------------------------ */
    .board-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      width: 100%;
      max-width: calc(var(--board-max) + 40px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    #board {
      width: var(--board-max);
      touch-action: none;
    }

    [hidden] { display: none !important; }

    /* Highlight positioning */
    [data-square] { position: relative; }

    /* Selected square: Lichess yellowish highlight */
    [data-square].sq-selected::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: 0px;
      background: transparent; /* No yellow tint */
      box-shadow: inset 0 0 0 4px rgba(128, 128, 128, 0.8); /* Gray border */
    }

    /* Add these new rules for the overlay somewhere in your <style> section: */
    .board-wrapper {
      position: relative;
      width: var(--board-max);
    }

    .board-overlay {
      position: absolute;
      inset: 0;
      background: rgba(26, 26, 46, 0.8); /* Dark semi-transparent background */
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      border-radius: 4px;
    }

    .board-overlay.active {
      opacity: 1;
      pointer-events: auto; /* Catches any stray clicks while locked */
    }

    /* Valid moves: Lichess gray dot */
    [data-square].sq-valid::after {
      content: '';
      position: absolute;
      width: 25%;
      height: 25%;
      background: rgba(0, 0, 0, 0.25); 
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: none;
      pointer-events: none; 
    }

    /* ------------------------------------------------------------------ */
    /* Turn & Info Strip                                                   */
    /* ------------------------------------------------------------------ */
    .info-strip {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .turn-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .turn-swatch {
      width: 18px; height: 18px;
      border-radius: 4px;
      border: 2px solid rgba(255,255,255,0.2);
      background: #f0d9b5;
      transition: background 0.3s;
    }

    .turn-swatch.black { background: #333; }

    /* ------------------------------------------------------------------ */
    /* Voice Panel                                                         */
    /* ------------------------------------------------------------------ */
    .voice-panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 4px 0;
    }

    .mic-btn {
      width: 90px; height: 90px;
      border-radius: 50%;
      border: none;
      background: var(--voice-color);
      color: #fff;
      font-size: 2.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.5);
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      position: relative;
    }

    .mic-btn:active { transform: scale(0.94); }

    .mic-btn.listening {
      background: var(--highlight);
      box-shadow: 0 4px 24px rgba(233, 69, 96, 0.6);
      animation: mic-pulse 1.2s ease-in-out infinite;
    }

    .mic-btn.processing {
      background: #ff9800;
      box-shadow: 0 4px 20px rgba(255, 152, 0, 0.5);
    }

    @keyframes mic-pulse {
      0%, 100% { box-shadow: 0 4px 24px rgba(233, 69, 96, 0.6); transform: scale(1); }
      50%       { box-shadow: 0 4px 40px rgba(233, 69, 96, 0.9); transform: scale(1.06); }
    }

    .mic-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
      letter-spacing: 0.04em;
    }

    .transcript-box {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 12px 16px;
      min-height: 52px;
      font-size: 0.9rem;
      color: var(--text-primary);
      text-align: center;
      line-height: 1.5;
    }

    .transcript-box .heard-text  { color: var(--voice-light); font-style: italic; }
    .transcript-box .hint-text   { color: var(--text-muted); }
    .transcript-box .parsed-move { color: #4caf50; font-weight: 700; }
    .transcript-box .error-text  { color: var(--highlight); }

    /* ------------------------------------------------------------------ */
    /* Select Panel hint                                                   */
    /* ------------------------------------------------------------------ */
    .select-hint {
      width: 100%;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      padding: 4px 0;
      min-height: 22px;
      transition: color 0.2s;
    }

    .select-hint.active { color: #ffd700; font-weight: 600; }

    /* ------------------------------------------------------------------ */
    /* Controls                                                            */
    /* ------------------------------------------------------------------ */
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button.std-btn {
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    button.std-btn:active { transform: scale(0.96); }

    .btn-primary   { background: var(--highlight); color: #fff; }
    .btn-secondary { background: var(--accent);    color: var(--text-primary); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ------------------------------------------------------------------ */
    /* Move Log                                                            */
    /* ------------------------------------------------------------------ */
    .move-log-section {
      width: 100%;
      max-width: calc(var(--board-max) + 40px);
    }

    .move-log-section h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    #moveLog {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 12px 16px;
      min-height: 64px;
      max-height: 140px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.7;
      box-shadow: var(--shadow);
    }

    #moveLog .move-entry         { color: var(--text-primary); }
    #moveLog .move-entry.event   { color: #4caf50; font-style: italic; }

    /* ------------------------------------------------------------------ */
    /* Responsive                                                          */
    /* ------------------------------------------------------------------ */
    @media (max-width: 400px) {
      header h1 { font-size: 1.2rem; }
      button.std-btn { padding: 10px 18px; font-size: 0.82rem; }
      .mode-btn { font-size: 0.82rem; padding: 10px 14px; }
    }

    /* ------------------------------------------------------------------ */
    /* Promotion Dialog                                                    */
    /* ------------------------------------------------------------------ */
    #promoModal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #promoBackdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
    }

    #promoDialog {
      position: relative;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px 28px 28px;
      text-align: center;
      z-index: 1;
      min-width: 280px;
    }

    #promoDialog p {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 18px;
      color: var(--text-primary);
    }

    #promoChoices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .promo-btn {
      padding: 16px 12px;
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      background: var(--accent);
      color: var(--text-primary);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .promo-btn:hover  { background: var(--highlight); border-color: var(--highlight); }
    .promo-btn:active { transform: scale(0.95); }

    /* ------------------------------------------------------------------ */
    /* Robot-Busy Overlay                                                  */
    /* ------------------------------------------------------------------ */
    .board-card { position: relative; }

    #robotBusyOverlay {
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      background: rgba(22, 33, 62, 0.78);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
      backdrop-filter: blur(2px);
    }

    #robotBusyOverlay p {
      color: var(--text-primary);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .spinner {
      width: 44px; height: 44px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: var(--highlight);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ------------------------------------------------------------------ */
    /* Game-Over Banner                                                    */
    /* ------------------------------------------------------------------ */
    #gameOverBanner {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #gameOverBackdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
    }

    #gameOverBox {
      position: relative;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px 36px;
      text-align: center;
      z-index: 1;
      min-width: 260px;
    }

    #gameOverBox h2 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffd700;
      margin-bottom: 8px;
    }

    #gameOverBox p {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      text-transform: capitalize;
    }
  </style>
</head>
<body>

<div class="page-wrapper">

  <header>
    <h1>Robotic Chess</h1>
    <p id="modeSubtitle">Tap or drag a piece to move.</p>
  </header>

  <div class="status-row">
    <div class="status-dot pending" id="statusDot"></div>
    <span id="statusText">Connecting…</span>
  </div>

  <div class="mode-toggle" role="group" aria-label="Input mode">
    <button class="mode-btn active" data-mode="select" id="modeSelectBtn">
      <span class="mode-icon">&#9610;</span> Select Piece
    </button>
    <button class="mode-btn" data-mode="voice" id="modeVoiceBtn">
      <span class="mode-icon">&#127908;</span> Voice Command
    </button>
  </div>

  <div class="board-card">

    <div class="board-wrapper">
      <div id="board"></div>
      <div id="boardOverlay" class="board-overlay">Robot is moving...</div>
    </div>

    <div id="robotBusyOverlay" style="display:none">
      <div class="spinner"></div>
      <p>Robot is moving…</p>
    </div>

    <div class="select-hint" id="selectHint">Tap or drag a piece to select it.</div>

    <div class="voice-panel" id="voicePanel" hidden>
      <button class="mic-btn" id="micBtn" aria-label="Hold to speak your move">
        &#127908;
      </button>
      <span class="mic-label" id="micLabel">TAP TO SPEAK</span>
      <div class="transcript-box" id="transcriptBox">
        <span class="hint-text">Say &ldquo;Robochess move e2 to e4&rdquo;</span>
      </div>
    </div>

    <div class="info-strip">
      <div class="turn-badge">
        <div class="turn-swatch" id="turnSwatch"></div>
        <span id="turnLabel">White to move</span>
      </div>
      <span id="moveCount">Move 1</span>
    </div>

    <div class="controls">
      <button class="std-btn btn-secondary" id="btnFlip">Flip Board</button>
      <button class="std-btn btn-primary"   id="btnReset">New Game</button>
    </div>
  </div>

  <div class="move-log-section">
    <h2>Move Log</h2>
    <div id="moveLog"></div>
  </div>

</div>

<!-- Promotion picker modal -->
<div id="promoModal" style="display:none">
  <div id="promoBackdrop"></div>
  <div id="promoDialog">
    <p>Promote pawn to…</p>
    <div id="promoChoices">
      <button class="promo-btn" data-piece="q">♛ Queen</button>
      <button class="promo-btn" data-piece="r">♜ Rook</button>
      <button class="promo-btn" data-piece="b">♝ Bishop</button>
      <button class="promo-btn" data-piece="n">♞ Knight</button>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"
        crossorigin="anonymous"></script>

<script>
(function () {
  'use strict';

  // =========================================================================
  // State
  // =========================================================================
  let isBoardLocked = false;
  let currentMode = 'select'; // 'select' | 'voice'
  let selectedSquare = null;
  let moveNumber = 1;

  // =========================================================================
  // WebSocket
  // =========================================================================
  const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
  const WS_URL   = `${protocol}://${location.host}/ws`;
  let socket      = null;
  let reconnectMs = 2000;

  function setStatus(state, text) {
    $('#statusDot').removeClass('connected disconnected pending').addClass(state);
    $('#statusText').text(text);
  }

  function connect() {
    setStatus('pending', 'Connecting…');
    socket = new WebSocket(WS_URL);

    socket.addEventListener('open', () => {
      setStatus('connected', 'Connected');
      reconnectMs = 2000;
      logEvent('Connected to server.');
    });

    socket.addEventListener('close', () => {
      setStatus('disconnected', `Reconnecting in ${reconnectMs / 1000}s…`);
      logEvent('Connection lost — reconnecting…');
      setTimeout(connect, reconnectMs);
      reconnectMs = Math.min(reconnectMs * 2, 30000);
    });

    socket.addEventListener('error', () => setStatus('disconnected', 'Connection error'));

    socket.addEventListener('message', (evt) => {
      let msg;
      try { msg = JSON.parse(evt.data); } catch { return; }

      // Unlock board upon receiving any valid server response
      isBoardLocked = false;
      $('#boardOverlay').removeClass('active'); 

      if (msg.fen) {
        board.position(msg.fen, false); // false = instant snap to new FEN
        chess.load(msg.fen);   
        updateTurnDisplay(msg.fen);
      }

      if (msg.event === 'invalid') {
        clearSelection();
        setVoiceResult(`Could not play "${msg.uci}". Try again.`, 'error');
      } else if (msg.event === 'move' && msg.uci) {
        logMove(msg.uci);
        clearSelection();
      } else if (msg.event === 'reset') {
        $('#moveLog').empty();
        moveNumber = 1;
        clearSelection();
        hideGameOver();
        logEvent('Game reset.');
      } else if (msg.event === 'sync') {
        logEvent('Board synchronised.');
      } else if (msg.event === 'robot_busy') {
        $('#robotBusyOverlay').show();
        logEvent('Robot executing move…');
      } else if (msg.event === 'robot_idle') {
        $('#robotBusyOverlay').hide();
        logEvent('Robot ready.');
      } else if (msg.event === 'game_over' && msg.reason) {
        showGameOver(msg.reason);
        logEvent(`Game over: ${msg.reason}.`);
      }
    });
  }

  function sendMove(from, to, promotion) {
    if (socket && socket.readyState === WebSocket.OPEN) {
      isBoardLocked = true; // Lock the board!
      $('#boardOverlay').addClass('active'); // Turn on overlay
      socket.send(JSON.stringify({ from, to }));
    }
  }

  // =========================================================================
  // Board setup
  // =========================================================================
  const chess = new Chess();

  const config = {
    draggable : true,           // Enables picking up pieces
    moveSpeed : 'fast',         // Speeds up UI animation
    snapbackSpeed: 1,
    snapSpeed: 1,
    position  : 'start',
    pieceTheme: 'https://lichess1.org/assets/piece/cburnett/{piece}.svg',

    onDragStart: function (source, piece, position, orientation) {
      // Prevent drag if board is locked, mode is wrong, or disconnected
      if (isBoardLocked || currentMode !== 'select' || !socket || socket.readyState !== WebSocket.OPEN) {
        return false;
      }
      
      if ((chess.turn() === 'w' && piece.search(/^b/) !== -1) ||
          (chess.turn() === 'b' && piece.search(/^w/) !== -1)) {
        return false;
      }

      // Clear any previous highlights from tapping before we start dragging
      clearSelection();

      // Highlight the piece being dragged and its legal moves
      selectPiece(source);
    },

    onDrop: function (source, target) {
      // If dropped on the same square, let handleSquareClick manage click-to-move
      if (source === target) return; 

      // Check if move is locally valid using chess.js before sending to server
      const legalMoves = chess.moves({ verbose: true });
      const isValid = legalMoves.some(m => m.from === source && m.to === target);

      if (!isValid) {
        clearSelection();
        return 'snapback'; // Invalid move, snap piece back
      }

      // Move is valid, send to server
      sendMove(source, target);
      clearSelection();
    },
  };

  const board = Chessboard('board', config);
  $(window).resize(() => board.resize());

  // =========================================================================
  // Mode Selection
  // =========================================================================
  const SUBTITLES = {
    select: 'Tap or drag a piece to move.',
    voice:  'Say "Robochess move [from] [to]" — e.g. "Robochess move e2 to e4".',
  };

  function switchMode(mode) {
    currentMode = mode;

    $('.mode-btn').removeClass('active');
    $(`.mode-btn[data-mode="${mode}"]`).addClass('active');

    if (mode === 'voice') {
      $('#voicePanel').show();
      $('#selectHint').hide();
      startListening();   // begin always-on listening immediately
    } else {
      $('#voicePanel').hide();
      $('#selectHint').show();
      stopListening();    // stop listening when leaving voice mode
    }

    $('#modeSubtitle').text(SUBTITLES[mode]);
    clearSelection();
  }

  $('.mode-btn').on('click', function () {
    switchMode($(this).data('mode'));
  });

  // =========================================================================
  // SELECT PIECE MODE (Tap to Move)
  // =========================================================================
  $('#board').on('click', '[data-square]', function () {
    if (currentMode !== 'select') return;
    if (!socket || socket.readyState !== WebSocket.OPEN) return;

    const square = $(this).data('square');
    handleSquareClick(square);
  });

  function handleSquareClick(square) {
    if (isBoardLocked) return; // Ignore clicks if waiting for server

    const pos = board.position();
    const isOwnPiece = pos[square] && pos[square][0] === chess.turn();

    if (selectedSquare === null) {
      // First click: select if it's our piece
      if (!isOwnPiece) return;
      selectPiece(square);
    } else {
      // Second click
      if (square === selectedSquare) {
        // Tapped the same piece again -> deselect
        clearSelection();
      } else if (isOwnPiece) {
        // Tapped another of our own pieces -> switch selection
        clearSelection();
        selectPiece(square);
      } else {
        // Tapped an empty square or enemy piece -> attempt move
        sendMove(selectedSquare, square);
        clearSelection();
      }
    }
  }

  function selectPiece(square) {
    selectedSquare = square;
    highlightSquare(square, 'selected');

    const legalMoves = chess.moves({ square, verbose: true });
    legalMoves.forEach(m => highlightSquare(m.to, 'valid'));

    const count = legalMoves.length;
    $('#selectHint').addClass('active')
      .text(`${square.toUpperCase()} selected — ${count} move${count !== 1 ? 's' : ''} available.`);
  }

  function highlightSquare(square, type) {
    $(`[data-square="${square}"]`).addClass(`sq-${type}`);
  }

  function clearSelection() {
    selectedSquare = null;
    $('[data-square]').removeClass('sq-selected sq-valid');
    $('#selectHint').removeClass('active').text('Tap or drag a piece to select it.');
  }

  // =========================================================================
  // VOICE COMMAND MODE
  // =========================================================================
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer  = null;
  let listening   = false;

  if (SpeechRecognition) {
    recognizer = new SpeechRecognition();
    recognizer.lang        = 'en-US';
    recognizer.interimResults = true;
    recognizer.continuous  = true;
    recognizer.maxAlternatives = 3;

    recognizer.addEventListener('result', (evt) => {
      // In continuous mode, resultIndex points to the newest result only.
      const result  = evt.results[evt.resultIndex];
      const interim = result[0].transcript;

      // Show interim (in-progress) transcript while the user is still speaking.
      if (!result.isFinal) {
        setVoiceResult(`"${interim}"`, 'heard');
        return;
      }

      // Final result — scan all alternatives for the wake phrase.
      // Accepted forms: "Robochess move …", "Robo chess move …", "Robot chess move …"
      const WAKE_RE = /rob(?:o\s*|ot\s*)chess\s+move\s+(.*)/i;
      let commandText = null;
      for (let i = 0; i < result.length; i++) {
        const m = result[i].transcript.match(WAKE_RE);
        if (m) { commandText = m[1].trim(); break; }
      }

      if (!commandText) {
        // Wake phrase not heard — keep listening silently.
        setVoiceResult('<span class="hint-text">Listening… say &ldquo;Robochess move e2 to e4&rdquo;</span>');
        return;
      }

      // Wake phrase detected — try to parse the move that followed it.
      const parsed = parseVoiceMove(commandText);
      if (parsed) {
        setVoiceResult(
          `<span class="parsed-move">Moving: ${parsed.from.toUpperCase()} → ${parsed.to.toUpperCase()}</span>`
        );
        if (isPromotion(parsed.from, parsed.to)) {
          requestPromotion(parsed.from, parsed.to);
        } else {
          sendMove(parsed.from, parsed.to);
        }
      } else {
        setVoiceResult(
          `<span class="error-text">Heard wake phrase but couldn't parse move: "${escHtml(commandText)}"</span>`
        );
      }
    });

    recognizer.addEventListener('end', () => {
      // In continuous mode the browser can stop recognition after a long silence
      // or a network hiccup.  Restart automatically as long as we're supposed to
      // be listening so the user never has to tap the button again.
      if (listening) {
        try { recognizer.start(); } catch (_) { /* already starting */ }
      } else {
        updateMicUI();
      }
    });

    recognizer.addEventListener('error', (evt) => {
      listening = false;
      updateMicUI();
      const msg = evt.error === 'not-allowed'
        ? 'Microphone access denied. Check browser permissions.'
        : `Speech error: ${evt.error}`;
      setVoiceResult(msg, 'error');
    });
  }

  $('#micBtn').on('click', () => {
    if (!SpeechRecognition) {
      setVoiceResult('Speech recognition is not supported in this browser.', 'error');
      return;
    }
    if (isBoardLocked) {
      setVoiceResult('Waiting for server...', 'hint');
      return;
    }
    if (listening) {
      stopListening();
    } else {
      startListening();
    }
  });

  function startListening() {
    if (!recognizer || listening) return;
    try {
      recognizer.start();
      listening = true;
      updateMicUI();
      setVoiceResult('<span class="hint-text">Listening…</span>');
    } catch (e) {
      setVoiceResult('Could not start microphone.', 'error');
    }
  }

  function stopListening() {
    if (recognizer && listening) {
      recognizer.stop();
    }
    listening = false;
    updateMicUI();
  }

  function updateMicUI() {
    const $btn = $('#micBtn');
    const $lbl = $('#micLabel');
    $btn.removeClass('listening processing');
    if (listening) {
      $btn.addClass('listening');
      $lbl.text('ALWAYS LISTENING — TAP TO STOP');
    } else {
      $lbl.text('TAP TO START LISTENING');
    }
  }

  function setVoiceResult(text, type) {
    if (currentMode !== 'voice') return;
    let html;
    if (type === 'heard')  html = `<span class="heard-text">${escHtml(text)}</span>`;
    else if (type === 'parsed') html = `<span class="parsed-move">${escHtml(text)}</span>`;
    else if (type === 'error')  html = `<span class="error-text">${escHtml(text)}</span>`;
    else                        html = text;
    $('#transcriptBox').html(html);
  }

  // Maps spoken piece names (including common mishearings) to chess.js letters.
  const PIECE_WORDS = {
    'king': 'k', 'queen': 'q', 'rook': 'r',
    'bishop': 'b', 'knight': 'n', 'night': 'n', 'pawn': 'p',
  };

  // Resolve a SAN string like 'O-O' into a {from, to} pair using the live board.
  function resolveSAN(san) {
    const moves = chess.moves({ verbose: true });
    const m = moves.find(mv => mv.san === san || mv.san.replace(/[+#]/g, '') === san);
    return m ? { from: m.from, to: m.to } : null;
  }

  // Find which legal move involves pieceLetter landing on dest.
  function resolveByPiece(pieceLetter, dest) {
    const moves = chess.moves({ verbose: true });
    const m = moves.find(mv => mv.piece === pieceLetter && mv.to === dest);
    return m ? { from: m.from, to: m.to } : null;
  }

  // True if any legal move from→to is a pawn promotion.
  function isPromotion(from, to) {
    return chess.moves({ verbose: true })
      .some(m => m.from === from && m.to === to && m.promotion);
  }

  // Show the promotion-piece picker dialog then send the move.
  function requestPromotion(from, to) {
    $('#promoModal').show();
    $('#promoChoices .promo-btn').off('click').on('click', function () {
      $('#promoModal').hide();
      sendMove(from, to, $(this).data('piece'));
    });
  }

  function parseVoiceMove(text) {
    text = text.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').trim();

    // Castling
    const isQueenside = /queen.?side|long\s*castl|o\s*o\s*o/.test(text);
    const isKingside  = !isQueenside && /castl|king.?side|o\s*o/.test(text);
    if (isQueenside) return resolveSAN('O-O-O');
    if (isKingside)  return resolveSAN('O-O');

    // Two explicit squares: "e2 to e4", "e2e4", "a1 b3"
    const squares = text.match(/\b[a-h][1-8]\b/g);
    if (squares && squares.length >= 2) {
      return { from: squares[0], to: squares[1] };
    }

    // Piece name + destination: "knight to f3", "bishop takes e5"
    for (const [word, letter] of Object.entries(PIECE_WORDS)) {
      if (text.includes(word)) {
        const destMatch = text.match(/\b([a-h][1-8])\b/);
        if (destMatch) return resolveByPiece(letter, destMatch[1]);
        break;
      }
    }

    return null;
  }

  // =========================================================================
  // Shared UI helpers
  // =========================================================================
  function updateTurnDisplay(fen) {
    const parts = fen.split(' ');
    const isWhite = parts[1] === 'w';
    const fullMove = parseInt(parts[5] || '1', 10);
    $('#turnSwatch').toggleClass('black', !isWhite);
    $('#turnLabel').text(isWhite ? 'White to move' : 'Black to move');
    $('#moveCount').text(`Move ${fullMove}`);
  }

  function logMove(uci) {
    appendLog($('<div class="move-entry"></div>').text(`${moveNumber++}. ${uci}`));
  }

  function logEvent(text) {
    appendLog($('<div class="move-entry event"></div>').text(text));
  }

  function appendLog($el) {
    const $log = $('#moveLog');
    $log.append($el);
    $log.scrollTop($log[0].scrollHeight);
  }

  function escHtml(str) {
    return $('<span>').text(str).html();
  }

  // =========================================================================
  // Button handlers
  // =========================================================================
  $('#btnFlip').on('click', () => board.flip());

  $('#btnReset').on('click', () => {
    if (!confirm('Start a new game? The current game will be lost.')) return;
    fetch('/reset', { method: 'POST' })
      .then(r => r.json())
      .then(data => {
        if (data.fen) { board.position(data.fen, false); updateTurnDisplay(data.fen); }
      })
      .catch(() => logEvent('Reset request failed.'));
  });

  // =========================================================================
  // Boot
  // =========================================================================
  connect();
  switchMode('select');

})();
</script>
</body>
</html>
